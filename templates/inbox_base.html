<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Missed Call Assistant{% endblock %}</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 20px;background:#f5f5f5;color:#172331}
header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px}a{color:#075d79}
article,section{padding:20px;margin:16px 0;background:white;border:1px solid #ddd;border-radius:10px}
label{display:block;margin-top:12px}input,textarea{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:110px}
button{font:inherit;padding:9px 16px;margin:8px 8px 0 0;border:1px solid #075d79;border-radius:6px;background:#075d79;color:white;cursor:pointer}
small,.muted{color:#52606d}.message{white-space:pre-wrap;overflow-wrap:anywhere}.outbound{border-left:4px solid #075d79}.inbound{border-left:4px solid #6c5ca5}.notice{background:#fff3d8;padding:12px}.error{color:#a42323}
</style></head><body>
<header><h1>{% if business %}{{ business['name'] }}{% else %}Missed Call Assistant{% endif %}</h1>
{% if business %}<form method="post" action="{{ url_for('inbox.logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Sign out</button></form>{% endif %}</header>
{% block content %}{% endblock %}
</body></html>
